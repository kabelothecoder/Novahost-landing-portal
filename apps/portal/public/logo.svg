<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="160" height="36" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <style>
      .logo-text {
        fill: #1e293b; /* Slate 800 (Light Mode) */
      }
      @media (prefers-color-scheme: dark) {
        .logo-text {
          fill: #f8fafc; /* Slate 50 (Dark Mode) */
        }
      }
    </style>
  </defs>
  <!-- Logo Mark: Stylized Modern "M" / Node Icon -->
  <g transform="translate(4, 2)">
    <!-- Subtle backdrop square -->
    <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#logo-grad)" opacity="0.15" />
    <!-- Main Gateway / Server arch -->
    <path d="M8 22V14C8 10.6863 10.6863 8 14 8C17.3137 8 20 10.6863 20 14V22" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M14 8V22" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Interactive/glowing nodes -->
    <circle cx="8" cy="22" r="2.5" fill="#3b82f6" />
    <circle cx="14" cy="22" r="2.5" fill="#6366f1" />
    <circle cx="20" cy="22" r="2.5" fill="#8b5cf6" />
    <circle cx="14" cy="8" r="2.5" fill="#3b82f6" />
  </g>
  <!-- Logo Typography -->
  <text x="44" y="25" class="logo-text" font-family="Outfit, Inter, system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="-0.03em">NovaHost</text>
</svg>
